{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      {{ .Date.Format "January 2, 2006" }}
      {{ with .Params.tags }}
        {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
      {{ end }}
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ with .Params.categories }}
  <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
    <span style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;">
      Filed under: {{ range . }}{{ . }}{{ end }}
    </span>
  </div>
  {{ end }}
</article>
{{ end }}
